<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1200px; height: 630px; background: #0b0f17; color: #e6edf3; font-family: Inter, system-ui, sans-serif; overflow: hidden; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; }
  .glow { position: absolute; width: 900px; height: 500px; left: -200px; top: -250px; background: radial-gradient(closest-side, #16213a, transparent); }
  .wrap { position: relative; padding: 72px 80px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; color: #2dd4bf; font-size: 22px; margin: 0 0 14px; }
  h1 { font-size: 84px; margin: 0; letter-spacing: -0.02em; line-height: 1; }
  .title { color: #8b98ad; font-size: 30px; margin: 18px 0 0; }
  .row { display: flex; gap: 14px; align-items: center; }
  .node { border: 1.5px solid rgba(79,140,255,.6); background: #131a29; border-radius: 14px; padding: 14px 22px; font-size: 22px; font-weight: 500; }
  .node.hub { border-color: #2dd4bf; }
  .node.sink { border-color: #2dd4bf; background: #0f1a1f; }
  .pipe { flex: 1; height: 6px; border-radius: 3px; background: rgba(79,140,255,.45); position: relative; }
  .pipe.t { background: rgba(45,212,191,.5); }
  .pipe::after { content: ''; position: absolute; top: -3px; left: 45%; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px 4px rgba(79,140,255,.6); }
  .foot { font-family: 'IBM Plex Mono', monospace; color: #8b98ad; font-size: 22px; }
  .foot b { color: #e6edf3; font-weight: 500; }
</style></head>
<body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div>
    <p class="eyebrow">// backend · data infrastructure · google bigquery</p>
    <h1>Kakha Philauri</h1>
    <p class="title">Career as a data pipeline. Click it, drag it, query it with SQL.</p>
  </div>
  <div class="row">
    <div class="node">Bank of Georgia</div><div class="pipe"></div>
    <div class="node">DevExperts</div><div class="pipe"></div>
    <div class="node hub">Google · BigQuery</div><div class="pipe t"></div>
    <div class="node sink">BigQuery</div>
  </div>
  <div class="foot"><b>kaxuna.github.io</b> · press ~ for the terminal</div>
</div>
</body></html>
